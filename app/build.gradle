plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.evan.linea'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.evan.linea'
        minSdk 26
        targetSdk 35
        // numéro de build GitHub = numéro de version, pour que chaque APK soit une mise à jour
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        linea {
            // clé fixe : permet d'installer chaque nouvelle version par-dessus l'ancienne
            storeFile file('linea.jks')
            storePassword 'linea123'
            keyAlias 'linea'
            keyPassword 'linea123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.linea
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
